seed: 42
paths:
  training_csv: data/mock/metric_train_A.csv
  metric_train_csv: outputs/phase2_mock/metric_train.csv
  candidates_csv: outputs/phase2_mock/metric_candidates.csv
  queries_csv: outputs/phase2_mock/metric_queries.csv
  ground_truth_csv: outputs/phase2_mock/metric_ground_truth.csv
  split_audit_json: outputs/phase2_mock/split_audit.json
  cache_dir: outputs/phase2_mock/features
  train_manifest: outputs/phase2_mock/features/train.json
  candidate_manifest: outputs/phase2_mock/features/candidate.json
  query_manifest: outputs/phase2_mock/features/query.json
  feature_errors_csv: outputs/phase2_mock/feature_errors.csv
  best_checkpoint: outputs/phase2_mock/checkpoints/best.pt
  last_checkpoint: outputs/phase2_mock/checkpoints/last.pt
  training_log_csv: outputs/phase2_mock/triplet_training_log.csv
  predictions_csv: outputs/phase2_mock/triplet_predictions.csv
  embeddings_npz: outputs/phase2_mock/player_embeddings.npz
  metrics_csv: outputs/phase2_mock/triplet_metrics.csv
  evaluation_csv: outputs/phase2_mock/triplet_evaluation.csv
  opening_predictions_csv: outputs/phase2_mock/metric_opening_predictions.csv
  opening_metrics_csv: outputs/phase2_mock/metric_opening_metrics.csv
  opening_evaluation_csv: outputs/phase2_mock/metric_opening_evaluation.csv
  opening_errors_csv: outputs/phase2_mock/metric_opening_errors.csv
  comparison_csv: outputs/phase2_mock/baseline_comparison.csv
split:
  train_players: 4
  eval_players: 6
  train_games_per_player: 4
  candidate_games: 3
  query_games: 2
features:
  board_size: 19
  history_length: 8
  max_positions_per_game: 4
cache:
  games_per_shard: 8
  max_cached_shards: 2
model:
  in_channels: 17
  channels: 16
  num_blocks: 2
  embedding_dim: 32
  pool_size: 3
training:
  device: cpu
  batch_size: 8
  epochs: 2
  learning_rate: 0.001
  margin: 0.2
  weight_decay: 0.0001
  samples_per_epoch: 32
  num_workers: 0
  num_threads: 2
  deterministic: true
inference:
  batch_size: 32
  top_k: 5
opening:
  board_size: 19
  opening_moves: 40
